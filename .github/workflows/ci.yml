name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: matchlens
          POSTGRES_PASSWORD: matchlens
          POSTGRES_DB: matchlens
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U matchlens -d matchlens"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://matchlens:matchlens@localhost:5432/matchlens
      TEST_DATABASE_URL: postgresql+asyncpg://matchlens:matchlens@localhost:5432/matchlens_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Migrations apply cleanly and match the models
        run: |
          alembic upgrade head
          alembic check
      - run: pytest -q

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    # Upload -> matches -> ATS check in a real browser against the real API and database.
    # The LLM points at an address where nothing listens, so this exercises the no-LLM
    # fallbacks and needs no API keys.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: matchlens
          POSTGRES_PASSWORD: matchlens
          POSTGRES_DB: matchlens
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U matchlens -d matchlens"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://matchlens:matchlens@localhost:5432/matchlens
      LLM_BASE_URL: http://127.0.0.1:9/v1
      LLM_API_KEY: unused
      LLM_MAX_RETRIES: "0"
      CORS_ORIGINS: http://localhost:3100
      EMBED_CACHE_DIR: ${{ github.workspace }}/.fastembed
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Cache the embedding model
        uses: actions/cache@v6
        with:
          path: .fastembed
          key: fastembed-bge-small-en-v1.5
      - name: Start the API with synthetic jobs
        working-directory: backend
        run: |
          pip install -e .
          alembic upgrade head
          python -m ingestion.run --replay eval/fixtures/feeds --sources remotive,greenhouse
          nohup uvicorn app.main:app --port 8100 > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 60); do curl -sf localhost:8100/health && break; sleep 1; done
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and start the web app
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8100
        run: |
          npm ci
          npm run build
          nohup npm run start -- --port 3100 > "$RUNNER_TEMP/web.log" 2>&1 &
          for _ in $(seq 1 60); do curl -sf -o /dev/null localhost:3100 && break; sleep 1; done
      - name: Playwright
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/web.log
