[project]
name = "matchlens-backend"
version = "0.1.0"
description = "MatchLens API: resume parsing, job matching and ATS scoring"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn[standard]>=0.54,<1",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "asyncpg>=0.32,<1",
    "alembic>=1.20,<2",
    "pgvector>=0.5,<1",
    "openai>=3.46,<4",
    "fastembed>=0.9,<1",
    "httpx>=0.28,<1",
    "pdfplumber>=0.11.10,<0.12",
    "python-docx>=1.2,<2",
    "python-multipart>=0.0.33",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.17,<0.18",
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.4,<2",
    "reportlab>=5.1,<6",  # generates the sample resumes in eval/
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "db: needs a migrated Postgres at TEST_DATABASE_URL (skipped otherwise)",
    "slow: downloads or loads a local embedding model (skipped unless RUN_SLOW=1)",
]
